name: Build Uplayer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. BUAT KEYSTORE OTOMATIS
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore app/uplayer-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias uplayer -storepass uplayer123 -keypass uplayer123 -dname "CN=Uplayer, OU=Dev, O=Dev, L=City, S=State, C=ID"

      # 2. BUILD RELEASE APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 3. UPLOAD APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uplayer-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
